version: 2

models:
  - name: mart_account_monthly
    description: One row per account per month, with revenue, plan billed, and usage. Feeds the metrics layer.
    columns:
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: month
        data_tests:
          - not_null
      - name: revenue_usd
        data_tests:
          - not_null