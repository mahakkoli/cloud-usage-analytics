version: 2

models:
  - name: stg_accounts
    description: One row per customer account.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: plan
        data_tests:
          - accepted_values:
              arguments:
                values: ['essentials', 'business', 'enterprise']
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['us-east', 'us-west', 'eu-west', 'ap-south']